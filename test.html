<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#02050c;--accent:#9cbfe2;--text:#fff;--subtext:#c8d8e8;
  --card:#0d1a2e;--border:rgba(156,191,226,0.15);
}
body{background:var(--bg);color:var(--text);font-family:'Poppins',sans-serif;overflow:hidden}

#pipeline-section{
  min-height:100vh;
  display:flex;flex-direction:column;
  background:linear-gradient(to bottom,#050d1a,#02050c);
}

.pg-header{
  padding:40px clamp(20px,5vw,60px) 20px;
  display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;
  flex-shrink:0;
}
.pg-header-left h2{font-size:clamp(24px,4vw,42px);font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:-0.01em}
.pg-header-left p{font-size:13px;color:var(--subtext);margin-top:6px;max-width:500px;line-height:1.6}

.pg-legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--subtext)}
.leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.pg-controls{
  padding:0 clamp(20px,5vw,60px) 10px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex-shrink:0;
}
.filter-btn{
  padding:5px 14px;border:1px solid var(--border);background:transparent;
  color:var(--subtext);font-family:'Poppins',sans-serif;font-size:11px;
  border-radius:4px;cursor:pointer;transition:.2s;letter-spacing:0.04em;
}
.filter-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.filter-btn:hover:not(.active){border-color:var(--accent);color:var(--accent)}
.zoom-btn{
  padding:5px 10px;border:1px solid var(--border);background:rgba(156,191,226,0.06);
  color:var(--subtext);font-family:'Poppins',sans-serif;font-size:14px;
  border-radius:4px;cursor:pointer;transition:.2s;
}
.zoom-btn:hover{border-color:var(--accent);color:var(--accent)}
.ctrl-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.hint{font-size:11px;color:rgba(156,191,226,0.4);margin-left:8px}

#canvas-wrap{
  flex:1;position:relative;overflow:hidden;cursor:grab;min-height:0;
}
#canvas-wrap:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}

/* DETAIL PANEL */
#detail{
  position:absolute;bottom:20px;right:20px;width:280px;
  background:rgba(10,18,35,0.95);border:1px solid var(--border);
  border-radius:12px;padding:18px;backdrop-filter:blur(12px);
  transform:translateX(320px);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;z-index:10;
}
#detail.open{transform:translateX(0);pointer-events:auto}
#detail-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--subtext);font-size:16px;cursor:pointer;padding:2px 6px}
#detail-tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:0.08em;border:1px solid;margin-bottom:10px}
#detail-name{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:8px;line-height:1.3}
#detail-desc{font-size:12px;color:var(--subtext);line-height:1.7;margin-bottom:12px}
#detail-meta{display:flex;flex-direction:column;gap:6px}
.meta-row{display:flex;justify-content:space-between;font-size:11px}
.meta-key{color:rgba(156,191,226,0.5);letter-spacing:0.06em}
.meta-val{color:var(--text);font-weight:600}

/* MINIMAP */
#minimap{
  position:absolute;bottom:20px;left:20px;
  background:rgba(10,18,35,0.8);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;
}
</style>
</head>
<body>

<div id="pipeline-section">
  <div class="pg-header">
    <div class="pg-header-left">
      <h2>Full Pipeline Architecture</h2>
      <p>Drag to pan · scroll to zoom · click any node for details · use filters to highlight paths</p>
    </div>
    <div class="pg-legend">
      <div class="leg-item"><div class="leg-dot" style="background:#4a9eca"></div>Data Source</div>
      <div class="leg-item"><div class="leg-dot" style="background:#6fcf97"></div>Branch / Ingest</div>
      <div class="leg-item"><div class="leg-dot" style="background:#f2994a"></div>Processing</div>
      <div class="leg-item"><div class="leg-dot" style="background:#bb86fc"></div>EDA / Analysis</div>
      <div class="leg-item"><div class="leg-dot" style="background:#e8880a"></div>ML / Modeling</div>
      <div class="leg-item"><div class="leg-dot" style="background:#eb5757"></div>Output</div>
      <div class="leg-item"><div class="leg-dot" style="background:#9cbfe2"></div>Infra / DevOps</div>
    </div>
  </div>

  <div class="pg-controls">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="source">Data Sources</button>
    <button class="filter-btn" data-filter="process">Processing</button>
    <button class="filter-btn" data-filter="eda">EDA</button>
    <button class="filter-btn" data-filter="ml">ML</button>
    <button class="filter-btn" data-filter="output">Outputs</button>
    <div class="ctrl-sep"></div>
    <button class="zoom-btn" id="zin">+</button>
    <button class="zoom-btn" id="zout">−</button>
    <button class="zoom-btn" id="zreset">⌂</button>
    <span class="hint">Click node to inspect</span>
  </div>

  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <canvas id="minimap" width="160" height="80"></canvas>
    <div id="detail">
      <button id="detail-close">✕</button>
      <span id="detail-tag"></span>
      <div id="detail-name"></div>
      <div id="detail-desc"></div>
      <div id="detail-meta"></div>
    </div>
  </div>
</div>

  {from:'testing',  to:'ml_pred',    color:'#9cbfe2', dash:true},
  {from:'config',   to:'ml_pred',    color:'#9cbfe2', dash:true},

  {from:'ms1',      to:'create_repo',color:'#9cbfe2', dash:true},

  {from:'ml_pred',  to:'ms1',        color:'#e8880a'},

  {from:'mlaas',    to:'web_app',    color:'#e8880a'},

  {from:'create_repo',to:'org',      color:'#9cbfe2', dash:true},

// ─── NODE DIMENSIONS ───
const NW = 148, NH = 50, NR = 8;
NODES.forEach(n=>{ n.w=NW; n.h=NH; });

// ─── STATE ───
let ox=0, oy=0, scale=0.55;
let drag=false, lastX=0, lastY=0;
let hovered=null, selected=null;
let activeFilter='all';
let animT=0;

// ─── BOUNDS ───
function bounds(){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  NODES.forEach(n=>{
    minX=Math.min(minX,n.x); minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x+n.w); maxY=Math.max(maxY,n.y+n.h);
  });
  return{minX,minY,maxX,maxY,w:maxX-minX,h:maxY-minY};
}

function resetView(){
  const b=bounds(), W=wrap.clientWidth, H=wrap.clientHeight;
  scale=Math.min(W/(b.w+120), H/(b.h+120), 1);
  ox=(W-b.w*scale)/2 - b.minX*scale;
  oy=(H-b.h*scale)/2 - b.minY*scale;
}

// ─── RESIZE ───
function resize(){
  canvas.width=wrap.clientWidth;
  canvas.height=wrap.clientHeight;
}

// ─── HIT TEST ───
function hit(nx,ny,nw,nh,wx,wy){
  const sx=nx*scale+ox, sy=ny*scale+oy;
  return wx>=sx&&wx<=sx+nw*scale&&wy>=sy&&wy<=sy+nh*scale;
}

// ─── FILTER LOGIC ───
function nodeVisible(n){
  if(activeFilter==='all') return true;
  return n.cat===activeFilter;
}
function edgeVisible(e){
  const s=NODES.find(n=>n.id===e.from), t=NODES.find(n=>n.id===e.to);
  if(!s||!t) return false;
  if(activeFilter==='all') return true;
  return nodeVisible(s)||nodeVisible(t);
}

// ─── DRAW ───
function typeColor(t){
  return C[t]||C.infra;
}

function drawNode(n, alpha=1){
  const x=n.x*scale+ox, y=n.y*scale+oy;
  const w=n.w*scale, h=n.h*scale;
  const isHov=(hovered===n.id), isSel=(selected===n.id);
  const dim=!nodeVisible(n)&&activeFilter!=='all';
  const a=dim?0.15:alpha;

  ctx.save();
  ctx.globalAlpha=a;

  // Shadow on hover/select
  if((isHov||isSel)&&!dim){
    ctx.shadowColor=typeColor(n.type);
    ctx.shadowBlur=16*scale;
  }

  // Card bg
  ctx.fillStyle=C.card;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,NR*scale);
  ctx.fill();

  // Color accent bar (left side)
  ctx.fillStyle=typeColor(n.type);
  ctx.beginPath();
  ctx.roundRect(x,y,4*scale,h,NR*scale);
  ctx.fill();

  // Border
  ctx.strokeStyle=isSel?typeColor(n.type):isHov?'rgba(156,191,226,0.5)':C.border;
  ctx.lineWidth=isSel?1.5:0.5;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,NR*scale);
  ctx.stroke();

  ctx.shadowBlur=0;

  // Label
  const fs=Math.max(8, 11*scale);
  ctx.font=`600 ${fs}px 'Poppins',sans-serif`;
  ctx.fillStyle='#ffffff';
  ctx.textAlign='left';
  ctx.textBaseline='middle';
  const tx=x+10*scale, maxW=w-16*scale;
  ctx.fillText(n.label, tx, y+h*(n.sub?0.35:0.5), maxW);

  if(n.sub){
    const sf=Math.max(7, 9.5*scale);
    ctx.font=`300 ${sf}px 'Poppins',sans-serif`;
    ctx.fillStyle='rgba(200,216,232,0.65)';
    ctx.fillText(n.sub, tx, y+h*0.65, maxW);
  }

  ctx.restore();
}

function drawEdge(e){
  const s=NODES.find(n=>n.id===e.from), t=NODES.find(n=>n.id===e.to);
  if(!s||!t) return;
  const dim=!edgeVisible(e)&&activeFilter!=='all';
  const alpha=dim?0.04:0.5;

  const sx=(s.x+s.w)*scale+ox, sy=(s.y+s.h/2)*scale+oy;
  const tx2=t.x*scale+ox,       ty2=(t.y+t.h/2)*scale+oy;
  const cpx=(sx+tx2)/2;

  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=e.color||C.edge;
  ctx.lineWidth=1;
  if(e.dash) ctx.setLineDash([4,4]);

  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.bezierCurveTo(cpx,sy,cpx,ty2,tx2,ty2);
  ctx.stroke();

  // Arrowhead
  const angle=Math.atan2(ty2-(sy+(ty2-sy)*0.9), tx2-(sx+(tx2-sx)*0.9));
  const al=6, aw=4;
  ctx.setLineDash([]);
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(tx2,ty2);
  ctx.lineTo(tx2-al*Math.cos(angle-aw/6),ty2-al*Math.sin(angle-aw/6));
  ctx.lineTo(tx2-al*Math.cos(angle+aw/6),ty2-al*Math.sin(angle+aw/6));
  ctx.closePath();
  ctx.fillStyle=e.color||C.edge;
  ctx.globalAlpha=alpha;
  ctx.fill();

  ctx.restore();
}

function drawMinimap(){
  const b=bounds();
  mctx.clearRect(0,0,160,80);
  mctx.fillStyle='rgba(10,18,35,0.9)';
  mctx.fillRect(0,0,160,80);

  const ms=Math.min(160/b.w, 80/b.h)*0.85;
  const mox=(160-b.w*ms)/2-b.minX*ms;
  const moy=(80 -b.h*ms)/2-b.minY*ms;

  NODES.forEach(n=>{
    mctx.fillStyle=typeColor(n.type);
    mctx.globalAlpha=nodeVisible(n)||activeFilter==='all'?0.7:0.12;
    mctx.fillRect(n.x*ms+mox, n.y*ms+moy, Math.max(2,n.w*ms), Math.max(2,n.h*ms));
  });

  // Viewport rect
  const vx=(-ox/scale)*ms+mox, vy=(-oy/scale)*ms+moy;
  const vw=(canvas.width/scale)*ms, vh=(canvas.height/scale)*ms;
  mctx.globalAlpha=1;
  mctx.strokeStyle='rgba(156,191,226,0.6)';
  mctx.lineWidth=1;
  mctx.strokeRect(vx,vy,vw,vh);
}

function draw(){
  animT++;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Grid dots
  const gs=40*scale;
  ctx.fillStyle='rgba(156,191,226,0.04)';
  for(let gx=(ox%gs+gs)%gs;gx<canvas.width;gx+=gs)
    for(let gy=(oy%gs+gs)%gs;gy<canvas.height;gy+=gs)
      ctx.fillRect(gx,gy,1.5,1.5);

  // Edges
  EDGES.forEach(drawEdge);
  // Nodes
  NODES.forEach(n=>drawNode(n));

  drawMinimap();
  requestAnimationFrame(draw);
}

// ─── INTERACTIONS ───
canvas.addEventListener('mousedown', e=>{
  drag=true; lastX=e.clientX; lastY=e.clientY;
});
canvas.addEventListener('mousemove', e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  if(drag){ ox+=e.clientX-lastX; oy+=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; return; }
  let h=null;
  for(const n of NODES){ if(hit(n.x,n.y,n.w,n.h,mx,my)){h=n.id;break;} }
  hovered=h;
  canvas.style.cursor=h?'pointer':'grab';
});
canvas.addEventListener('mouseup', e=>{
  if(!drag) return;
  drag=false;
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  for(const n of NODES){
    if(hit(n.x,n.y,n.w,n.h,mx,my)){
      selected=n.id; showDetail(n); return;
    }
  }
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const factor=e.deltaY<0?1.1:0.9;
  const ns=Math.max(0.2,Math.min(3,scale*factor));
  ox=mx-(mx-ox)*(ns/scale);
  oy=my-(my-oy)*(ns/scale);
  scale=ns;
},{passive:false});

// Touch
let lastDist=0;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){drag=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}
  if(e.touches.length===2){lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&drag){ox+=e.touches[0].clientX-lastX;oy+=e.touches[0].clientY-lastY;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}
  if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale=Math.max(0.2,Math.min(3,scale*d/lastDist));lastDist=d;}
},{passive:true});
canvas.addEventListener('touchend',()=>{drag=false;});

// ─── DETAIL PANEL ───
function showDetail(n){
  const panel=document.getElementById('detail');
  const col=typeColor(n.type);
  const tagEl=document.getElementById('detail-tag');
  tagEl.textContent=n.type.toUpperCase();
  tagEl.style.color=col;
  tagEl.style.borderColor=col;
  tagEl.style.background=col+'18';
  document.getElementById('detail-name').textContent=n.label+(n.sub?' — '+n.sub:'');
  document.getElementById('detail-desc').textContent=n.desc||'';
  const metaEl=document.getElementById('detail-meta');
  metaEl.innerHTML=Object.entries(n.meta||{}).map(([k,v])=>
    `<div class="meta-row"><span class="meta-key">${k}</span><span class="meta-val">${v}</span></div>`
  ).join('');
  panel.classList.add('open');
}
document.getElementById('detail-close').onclick=()=>{
  document.getElementById('detail').classList.remove('open');
  selected=null;
};

// ─── ZOOM BUTTONS ───
document.getElementById('zin').onclick=()=>{scale=Math.min(3,scale*1.2)};
document.getElementById('zout').onclick=()=>{scale=Math.max(0.2,scale/1.2)};
document.getElementById('zreset').onclick=resetView;

// ─── FILTER BUTTONS ───
document.querySelectorAll('.filter-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    activeFilter=b.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
});

// ─── INIT ───
resize();
resetView();
draw();
window.addEventListener('resize',()=>{ resize(); resetView(); });
</script>
